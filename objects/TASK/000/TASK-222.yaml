title: config_value key matching diverges from settings.rs from_toml (case-sensitivity, quote stripping)
description: |
  dolt_store.rs:444 config_value compares keys exactly, while settings.rs::from_toml lowercases keys — `Store = dolt` in settings.toml is honored by the settings loader's convention but silently selects the aida backend. Also config_value uses trim_matches('"') (strips unmatched/repeated quotes) where settings.rs unquote requires a matched pair. Two parsers over the same file with different tolerance. Suggest reusing one parse helper.

  Raised in review of PR-85: https://github.com/joemooney/quizdom/pull/85#issuecomment-5017187770
