title: Dolt reachable inherits cte_max_recursion_depth (~1000); very deep chains error only on the Dolt backend
description: |
  The recursive CTE in DoltDomainStore::reachable (dolt_store.rs:315) is subject to MySQL/Dolt's default cte_max_recursion_depth (~1000). A >1000-hop chain errors on the Dolt backend while the aida backend's app-side walk succeeds. Not plausible for the current domain graph; noting for parity completeness. Could SET SESSION cte_max_recursion_depth in the query if it ever matters.

  Raised in review of PR-85: https://github.com/joemooney/quizdom/pull/85#issuecomment-5017187770
