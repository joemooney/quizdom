title: Deleting Q-23 also removed the intent-side 'Q-23 references STORY-16' edge
description: |
  The store held exactly one non-custom edge touching a domain node: Q-23 references STORY-16 (the seed-cluster story). Deleting Q-23 (required by acceptance: zero domain objects) necessarily removed that references edge; STORY-16 itself is untouched. The Dolt graph never carried this edge (endpoint outside the domain set), so the Q-23→STORY-16 provenance link now exists only in aida-store git history. If cross-substrate provenance links matter, the advisor may want a convention for them (e.g. a comment on STORY-16 naming the Dolt node id — I did not add one, since the spec said to leave intent objects untouched).

  Raised by the implementer while working STORY-209.
