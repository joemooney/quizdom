title: db-migrate does not preserve AIDA Opened/Modified timestamps on migrated nodes
description: |
  The STORY-206 exporter leaves nodes.created_at / nodes.updated_at to their
  schema defaults (load time) instead of carrying over the AIDA objects'
  Opened/Modified times. The spec's acceptance criteria only covered object,
  edge, and weight parity, so this shipped as a within-scope design call —
  but if historical provenance matters for the domain graph (e.g. "when was
  this question generated"), a follow-up could parse the Opened:/Modified:
  lines from `aida show` and write explicit timestamp literals. Noted in
  docs/architecture/graph-schema.md § Migration.

  Raised by the implementer while working STORY-206.
