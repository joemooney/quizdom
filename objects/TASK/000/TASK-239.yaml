title: ADR supersede/retire mapped onto status 'rejected' + tags — AIDA has no native superseded status
description: |
  STORY-209 asked to mark ADR-3/ADR-31/ADR-22 "superseded/retired", but AIDA's status vocabulary is draft/approved/planned/in-progress/done/completed/rejected — no superseded state. Shipped mapping: status=rejected + tag superseded-by:ADR-201 (ADR-3) / retired-by:STORY-208 (ADR-31, ADR-22) + an explanatory comment on each clarifying that 'rejected' here means adopted-then-replaced, not turned down. If this reads as misleading in listings, the advisor may want a substrate-level 'superseded' status (VIS-2 dogfood gap) or a different convention.

  Raised by the implementer while working STORY-209.
