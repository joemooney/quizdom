title: Adopt 'aida graph --follow' for domain traversal; revisit ADR-31 app-side one-hop BFS
description: 'Upstream FR-282 shipped: ''aida graph <id> --follow probes --follow begets'' now does transitive traversal over custom edge types, which is exactly the gap ADR-31 worked around with app-side one-hop ''aida rel list'' BFS (see TASK-30). Evaluate replacing (or backing) the app-side walker with the native traversal: check depth limiting, output format parseability, and whether query_graph''s MCP mirror also supports follow mode. If adopted, amend ADR-31 with the reversal note. Acceptance: a decision comment on ADR-31 (adopt / keep app-side / hybrid) plus, if adopting, the session engine walking Q -> TERM -> follow-ups via --follow with tests.'
