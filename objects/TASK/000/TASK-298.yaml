title: db-migrate's no-op commit message overloads the empty-import case
description: |
  crates/quizdom/src/db_migrate.rs:234-238 prints

      "Import matched what Dolt already held — nothing new to commit."

  whenever `commit_all` returns false. That is accurate for the idempotent
  re-run STORY-291 targeted, but it also fires when the AIDA store held zero
  domain objects and nothing was imported at all — where the honest line is
  "nothing to import", not "matched what Dolt already held".

  Purely a wording issue on a rare path. Distinguishing the two would mean
  branching on `nodes.is_empty() && kept.is_empty()` before the message.

  Raised in review of PR-98: https://github.com/joemooney/quizdom/pull/98
