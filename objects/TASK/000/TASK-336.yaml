title: Two clippy::too_many_arguments allows remain outside session.rs (frontend.rs, tui.rs)
description: |
  STORY-327's TASK-315 retired all seven allows on session.rs free functions and
  left two standing, exactly as TASK-315 scoped it:

  - crates/quizdom/src/frontend.rs:100
  - crates/quizdom/src/tui.rs:2360

  Both predate STORY-260 and neither file was in STORY-293's or STORY-327's
  stated file set, so they were deliberately not touched. The lint is now
  retired everywhere else in the crate, which makes these two the entire
  remaining backlog for it — worth deciding explicitly whether to finish the job
  or to keep them as accepted exceptions with a stated reason.

  Note the shape differs from what STORY-327 fixed. The session.rs free
  functions shared a recurring triple (config/logger/turn) that was one concept;
  these two are front-end constructors/renderers whose arguments may genuinely
  be independent. Check before assuming a payload struct is the right move —
  an `#[allow]` with a one-line rationale may be the honest answer for these.

  Raised by the implementer while working STORY-327.
