  content: |-
    Implemented on branch task-246 (commit a5724a6):

    - apply_log_signals now indexes both batch results by question id and claims each id by name, replacing the two positional `zip`s: `load_questions` -> signal pairing, and `reweight_questions` -> ReweightOutcome pairing.
    - A batch result missing a requested id is now a QuizdomError::Parse naming the seam ("load_questions"/"reweight_questions") and the id, instead of a silently truncated result. A reordered result is paired correctly rather than swapped.
    - Audited the other two batch call sites (strategy.rs:400 successor_questions, honing.rs:154 load_probed_terms) — neither pairs the result against a parallel list, so neither carries the same misattribution risk.

    Test status: 581/581 tests green (cargo test --workspace); cargo fmt --all --check clean.
    Tests added: bank drops the first question (errors), bank reverses its result (paired correctly by id), reweighter truncates its write (errors).
