title: Install dolt in CI so the real_dolt acceptance tests run in the pipeline
description: |
  The STORY-205/206/207 acceptance tests against a real Dolt repo (`cargo test real_dolt -- --ignored`, now 3 tests including the STORY-207 full-trait-surface + aida-parity check) are `#[ignore]`d because CI has no dolt binary — they only run when a developer remembers to run them locally. Adding a dolt install step to `.github/workflows/ci.yml` (e.g. the dolthub install script, or a cached binary) and a `cargo test real_dolt -- --ignored` step would put the EPIC-202 acceptance surface under CI before the backend flips on by default.

  Raised by the implementer while working STORY-207.
  Branch: epic-202-2  ·  Commit: 4d21269  (PR #85: https://github.com/joemooney/quizdom/pull/85)
