title: BUG-231 0-edge repro not reproducible; exporter kept on show-parse, parity hardened instead
description: |
  The filed repro ('Loaded 75 nodes and 0 edges' on main @ 14d2021) did not
  reproduce: with the current aida binary the exporter's Relations:-section
  parse (pinned AIDA_OUTPUT_FORMAT=human, BUG-200) sees all 75 custom edges,
  so the 0-edge state most likely came from an earlier aida version whose
  show output did not render custom edge kinds (the FR-282 limitation).

  Design call within spec scope: rather than switching the exporter's edge
  read to 'aida rel list' (which would have re-collapsed the two reads into
  one path), the exporter stays on the show-parse and the parity check gained
  an independent per-node 'aida rel list <id> --type <kind>' read - exactly
  what the acceptance asked for - plus an edge-by-edge cross-check between
  the two reads (crates/quizdom/src/db_migrate.rs, cross_check_edge_reads).
  Either leg going blind is now a hard parity error.

  Advisor note: the STORY-209 gate ("MUST NOT run until a real migration
  shows edge parity") is satisfied - a real migration now reports 75/75 edges,
  cross-check green, Q-23 begets lineage at its true 71-node depth, rerun
  idempotent.

  Raised by the implementer while working BUG-231.
