title: db-init and db-migrate never commit — their writes sit untracked in the Dolt working set
description: |
  `db-init` applies the schema DDL and `db-migrate` bulk-imports the graph with
  plain `dolt sql -q`, neither followed by `dolt add -A` + `dolt commit`. Only
  `DoltDomainStore` commits (dolt_store.rs:163-171). Consequence found while
  working STORY-261: the live `data/dolt` had exactly one commit ("Initialize data
  repository") and all 75 nodes / 75 edges sat untracked in the working set, so
  the first `db-backup` pushed an EMPTY history and reported success.

  STORY-261 worked around it — `db-backup` snapshots the working set before
  pushing (db_backup.rs `snapshot_working_set`) — but the root inconsistency
  remains: `dolt log` in a freshly bootstrapped+migrated repo is not the audit
  trail CLAUDE.md and dolt_store.rs describe, and any other consumer of Dolt
  history (diff between sessions, `dolt sql --branch`, a future dolt-backup mode)
  sees nothing until someone runs db-backup.

  Suggested fix: give db-init and db-migrate the same add+commit tail the store
  uses ("quizdom db-init: schema", "quizdom db-migrate: import N nodes / M
  edges"), which also makes db-migrate's idempotency visible as no-op commits.

  Raised by the implementer while working STORY-261.
