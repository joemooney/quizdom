title: STORY-367 kept /mode and /score persisting; only a bare /mode was demoted to mirror-only
description: |
  STORY-367's acceptance names `--mode` as the transient override that must not
  rewrite `settings.toml`. It says nothing about the in-session `/mode <token>`
  shortcut, which STORY-194 deliberately made a persisting surface ("the shortcut
  commands (/mouse, /score, /mode)"), so I preserved that: an explicit `/mode
  debate` and `/score` still write the file, on the reading that naming a value IS
  choosing a new default.

  What changed is narrower: `set_mode_in_session` now returns whether the user
  actually named a mode (crates/quizdom/src/session.rs), and a bare `/mode` — which
  only prints the current mode — mirrors instead of persisting. Under `--mode
  debate` that bare form used to write "debate" over a saved "socratic", because
  the live value differed from the file and the seam persisted any difference.

  The advisor may want to take the other reading: the session mode lives in the
  session LOG (it is a `mode_set` event, and resume restores it from there), so
  `settings.toml`'s `mode` is arguably only the default for NEW sessions, and a
  mid-session `/mode debate` writing it is the same category error STORY-367 is
  about — just one the user initiated. Under that reading `/mode` would become
  mirror-only too and `/settings set mode` would be the only mode-persisting
  surface. I did not take it because it reverses a stated STORY-194 design decision
  and the spec did not ask for it.

  Raised by the implementer while working STORY-367.
