title: quizdom logs could read the rotated generation inline (--all)
description: |
  `quizdom logs` reads the live log and merely POINTS at `quizdom.log.1` when a
  rotation has happened; `--path <log>.1` is the manual way to read it. The
  natural completion is `--all`, concatenating the kept generation ahead of the
  live one so a single command shows the full ~2 MiB trail in order, with
  `--tail N` then counting across both.

  Not done under STORY-342 because TASK-331's acceptance asked for a reader and a
  `--tail`, and the pointer already prevents the failure it was filed against
  (mistaking a rotated log for the whole story). Cheap to add if anyone actually
  reaches for it.

  Raised by the implementer while working STORY-342.
