  author: joe
  content: 'Implemented via STORY-261 (commit 31dcff3): file-based Dolt remote (no hosted account), `quizdom db-backup` (snapshot working set + push main) and `quizdom db-restore` (clone back, refuses to overwrite an existing repo). Backup dir defaults to ~/.local/share/quizdom/dolt-backup, outside the project tree. Recovery steps documented in OVERVIEW.md § Durability and recovery; verified end to end at 75 nodes / 75 edges. Two traps found: dolt clone enumerates its cwd as databases (now clones from an empty scratch dir), and db-init/db-migrate leave writes uncommitted so a push would upload an empty history (now snapshotted first — see TASK-272).'
