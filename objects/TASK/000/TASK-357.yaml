title: DoltDomainStore has no foreign-change pre-flight, so a session absorbs a hand edit to nodes
description: |-
  STORY-351 gave db-init and db-migrate a pre-flight (db_init::refuse_on_foreign_changes) that refuses when a table they are about to stage already carries a hand-run edit, and switched every quizdom writer from 'dolt add -A' to staging nodes/edges by name.

  DoltDomainStore::commit got the staging half only. So a foreign TABLE in the working set is now safe from a session's commits, but a hand-run 'UPDATE nodes ...' or 'INSERT INTO nodes ...' sitting there when a session starts is still absorbed by the first store write, under a message describing a session answer.

  Deliberately out of STORY-351's scope for two reasons, both worth re-examining rather than inheriting:
  - Cost/shape: the store commits per write, so a naive pre-flight is one extra dolt spawn per write. The cheap version is a once-per-process check before the first commit (an AtomicBool, like GRAPH_WRITTEN in dolt_store.rs).
  - UX: refusing mid-session is worse than refusing at a command boundary. Failing at the FIRST write (before any answer is lost) is probably right; failing at the twentieth is not. Logging to the STORY-299 diagnostic log instead of refusing is the other candidate.

  Note db-backup remains the sanctioned way out either way: its snapshot deliberately stages -A under a message that claims nothing about authorship.

  ## Acceptance
  - A hand-run write to nodes present when a session starts is not committed under a quizdom session message.
  - Whatever the chosen behaviour (refuse at first write, or log), it costs at most one extra dolt spawn per process, not per write.
  - A test drives a real dolt repo with a foreign edit present through a session write.
