title: STORY-208 removed the QUIZDOM_STORE selector entirely, not just the default
description: |
  The spec title says "default to Dolt backend" but the acceptance says "removed code paths are gone, not feature-flagged off". Keeping an aida-selectable domain backend would have kept the ADR-31 per-hop walk and ADR-22 weight-tag parsing alive behind a flag, contradicting the acceptance (and STORY-209 empties the AIDA store of domain objects anyway). So the cutover deleted SelectedDomainStore and the QUIZDOM_STORE env/config key outright; only QUIZDOM_DOLT_PATH / dolt_path remain (crates/quizdom/src/dolt_store.rs). The aida CLI survives solely as AidaIntentStore (decision nodes + references edges, ADR-201), and the contradiction-resolution persister now splits its writes: contradicts edge -> Dolt, decision/references -> AIDA (crates/quizdom/src/contradiction.rs).

  Raised by the implementer while working STORY-208.
  Branch: epic-202-2  ·  Commit: 1cf0b84  (PR link added on merge)
