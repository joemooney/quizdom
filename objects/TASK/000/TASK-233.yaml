title: Six pre-existing clippy 1.92 lints in input.rs / session.rs (CI does not gate on -D warnings)
description: |
  'cargo clippy --all-targets -- -D warnings' fails on six pre-existing lints
  untouched by BUG-231: io::Error::other x3 (crates/quizdom/src/input.rs:368,
  398, 610), write! ending in newline (input.rs:657), and too-many-arguments
  8/7 x2 (crates/quizdom/src/session.rs:5045, 5124). CI runs clippy WITHOUT
  -D warnings so these do not gate merges, but they will bite anyone running
  the stricter local invocation or if CI is ever tightened.

  Raised by the implementer while working BUG-231.
