title: settings save/load are cfg(test) no-ops, so no test can prove the FILE survives a session that overrode it
description: |
  `settings::load_or_seed()` and `settings::save()` both return early under
  `cfg(test)` (crates/quizdom/src/settings.rs) — TASK-266 added the guard so a
  developer's real ~/.config/quizdom/settings.toml could not leak into the ~720
  in-crate tests, which is right.

  The cost showed up here. STORY-367's first acceptance criterion is "running with
  --mode does not alter settings.toml; the persisted value survives a session that
  overrode it (test)". No test can assert that literally: nothing in-crate can
  write or read the file. What I could test — and did — is the model one level in:
  `FrontEnd::persisted_settings()` is by construction exactly what a save writes,
  so the tests assert that a mirrored override never reaches it
  (a_mirrored_session_override_is_displayed_but_never_persisted, plus a TUI twin).
  That is a faithful proxy, but it is a proxy: a future bug in `save` itself, or a
  fourth caller reaching `settings::save` with the wrong struct, would pass.

  Suggested follow-up: make the config path injectable (an explicit path parameter
  threaded through `load_or_seed`/`save`, with the process-wide resolution staying
  at the call site) so tests can round-trip a real file in a temp dir, and add the
  end-to-end version of this test. The hermeticity guard would then be a temp-dir
  convention rather than compiled-out IO.

  Raised by the implementer while working STORY-367.
