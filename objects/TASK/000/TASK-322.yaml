title: The terminal-safety invariant is pinned by a source scan, not a captured fd
description: |
  STORY-299's acceptance asked for a test asserting the diagnostic seam "does not
  touch the terminal". `the_seam_never_touches_the_terminal`
  (crates/quizdom/src/diagnostics.rs) does that by scanning the seam's OWN source
  — everything above its test module, comment lines stripped — for print macros
  and `io::stdout`/`io::stderr`.

  That is stronger than a behavioural test in one way and weaker in another, and
  the advisor should know which trade was taken. Stronger: it covers every path
  through the module, including ones no test exercises, which is the property that
  actually matters (a print on a rare error branch is precisely what would corrupt
  a frame in the field). Weaker: it is a lexical check — a print reached through a
  re-export, a macro, or a helper in another module would pass it.

  The genuinely behavioural version is redirecting the process's fd 1 and 2 with
  `dup2` and asserting nothing arrived. That needs `libc` (or `nix`), which
  quizdom does not depend on and which felt like a poor trade for a seam whose
  only sink is a `File`. Filing it so the choice is visible rather than assumed;
  dismiss if the source scan is judged sufficient.

  Raised by the implementer while working STORY-299.
