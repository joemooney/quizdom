title: Backups are explicit (db-backup), not an automatic push after session writes
description: |
  TASK-243 offered two shapes: "a Dolt remote with a push after session writes, or
  a scheduled dolt backup". STORY-261 shipped neither automatically — `quizdom
  db-backup` is an explicit command, documented for cron / post-session use in
  OVERVIEW.md § Durability and recovery.

  Reasoning: a push is several dolt spawns (seconds), and ADR-203 already spawns
  `dolt` per query with no daemon. Spending that on every session write would tax
  the interactive loop for a guarantee the user hasn't asked for, and a silent
  per-write push has no obvious failure surface when the backup directory is a
  removable disk that isn't mounted.

  Also chosen here, for the advisor's awareness:
  - File remote (not DoltHub, not `dolt backup`), matching TASK-243's stated
    preference for avoiding a hosted-account dependency.
  - Default backup directory `~/.local/share/quizdom/dolt-backup` (env >
    settings > default), deliberately outside the project tree.
  - `db-restore` refuses to overwrite an existing repo rather than merging.

  If unattended durability is wanted, the natural follow-up is a post-session
  hook or a systemd timer rather than an in-loop push.

  Raised by the implementer while working STORY-261.
