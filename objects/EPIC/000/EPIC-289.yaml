description: 'Umbrella for the findings the EPIC-249 PRs (#91-#97) generated during their own reviews. Grouped into file-disjoint clusters so drains do not collide: settings.rs correctness; the db-init/db-migrate commit gap; db_backup.rs hardening; the DomainStore/signals contract follow-through; and dead-code hygiene. Two items are deliberately NOT in scope because they need a human design decision first — TASK-273 (should backups be automatic after session writes, or stay explicit?) and TASK-257 (where should a TUI app log, given the alternate screen makes eprintln invisible or corrupting?).'
