title: 'Dolt backend: implement DomainStore over dolt sql -r json with recursive-CTE traversal'
description: 'Implement the DomainStore trait against Dolt using dolt sql -r json CLI spawns per ADR-203 (no daemon). Includes multi-hop traversal as a single recursive CTE (replacing per-hop calls at the trait boundary), weight column reads, and node/edge writes with dolt commit. Backend selected by config/env so aida and dolt impls coexist. Depends on the trait slice and the schema slice. Acceptance: integration tests run the full trait surface against a fixture Dolt repo; traversal of a 3+ hop chain returns the same result set the aida backend produces on equivalent data.'
