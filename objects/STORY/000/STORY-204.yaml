title: 'Extract DomainStore trait: route all domain graph reads/writes through one storage abstraction (aida backend first)'
description: 'Pure refactor, no behavior change. Introduce a DomainStore trait covering every domain-graph operation quizdom performs (node fetch, edge list per ADR-31 one-hop, node/edge create, weight read). Move the existing aida-spawn choke point behind it as the first backend implementation. No Dolt dependency in this slice. Acceptance: cargo test passes unchanged; no aida spawns for domain data outside the trait impl; session loop behaves identically.'
