title: 'Exporter: migrate domain objects from .aida-store into Dolt with parity check'
description: 'One-shot migration tool (subcommand or script) that reads all Q-*/BELIEF-*/TERM-* domain objects and their custom edges from the AIDA store and inserts them into the Dolt nodes/edges tables, converting weight:N tags to the weight column. Includes a parity report: node count, edge count per kind, and spot-check of a known chain (e.g. Q-23 lineage). Depends on the schema slice. Acceptance: running against the real store loads all domain objects; parity report matches aida-side counts; re-running is safe (idempotent or clean-slate).'
