  content: |-
    Implemented via branch epic-202-2 (commit f0b0bad):

    - New `quizdom db-migrate` subcommand: reads all Q-*/TERM-*/BELIEF-* objects + custom edges via the aida CLI (BUG-200 choke point), loads Dolt nodes/edges in size-bounded `dolt sql` batches
    - weight:N tags become the numeric weight column; only the six custom edge kinds with both endpoints in the domain set migrate
    - Idempotent: nodes upsert, edges insert-ignore; parity report (counts per kind + recursive-CTE begets spot-check vs app-side BFS) hard-errors on mismatch
    - Verified against the real store: 75 nodes / 75 edges, full parity, clean re-run

    Test status: 563/563 unit tests green + 2 ignored real-dolt integration tests pass locally
    Follow-up: TASK-215 (timestamps not preserved — load-time defaults)
