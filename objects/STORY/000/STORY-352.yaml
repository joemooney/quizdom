  content: |-
    Implemented via branch story-352 (commit f813a01):

    - TASK-347: `render_logs` splits `ErrorKind::NotFound` (message + exit 0, the healthy install) from every other read failure (`QuizdomError::Io`, exit 1, naming the OS cause). A `--path` that found nothing also names the resolved log, so a typo's "no such file" no longer leaves two candidate paths unresolved.
    - TASK-349: new `diagnostics::one_line` collapses an event to one line of printable text on the WRITE side — CSI/OSC escape sequences dropped whole, other control characters to spaces. `logs.rs` re-applies it to entries and displayed paths, because `--path` reads files this crate never wrote.
    - TASK-348: `ROTATED_SUFFIX` is `pub(crate)`; the reader's `previous_generation` uses it instead of a second `".1"` literal.

    Test status: 714/714 tests green (7 new), clippy `-D warnings` clean, `cargo fmt --all --check` clean. All four surfaces also driven end to end against the built binary (`cat -v` on a colourized + `\r`-bearing log shows no `^[`, no `^M`).
    Follow-up: TASK-361 and TASK-362 filed as implementer findings (both `kind:design-choice`) for advisor triage.
