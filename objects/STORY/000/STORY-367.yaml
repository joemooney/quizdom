  content: |-
    Implemented on branch story-367 (commit be2d554):

    - TASK-356 + the third route: each front-end now keeps a display copy the engine mirrors its live score/mode into (`FrontEnd::mirror_live`, never writes) beside the persisted copy a save writes. Explicit changes cross one key at a time (`Settings::adopt`) through a single `persist(key)` per front-end; `settings::save` has exactly two callers, both inside it. Three routes closed: `/settings` pushing the live mode across as a persisting call, a bare `/mode` writing back the answer to its own question, and any explicit change saving the mirrored struct whole (`/settings set editor vim` persisted `mode = "debate"`).
    - TASK-355: the mode precedence tier is resolved once, into `config.mode` itself (`CliConfig::seeded_from`, called from `run_cli`), upstream of every reader and still outranked by `resolve_resume_config`. The BUG-136 resume auto-continue and the loop can no longer frame two different modes.

    Test status: 724/724 quizdom unit tests green (+7 in llm); clippy --workspace --all-targets -D warnings clean; cargo fmt clean.
    Both regression tests were verified against the pre-fix code rather than assumed: the resume test fails with [Debate, Socratic], and the mirror test fails when mirror_live is made to persist.

    Follow-up: TASK-372 (whether /mode should persist at all) and TASK-373 (settings save/load are cfg(test) no-ops, so the file-level round trip is untestable) filed as draft findings.
