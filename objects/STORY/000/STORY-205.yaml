title: 'Dolt schema and repo bootstrap: nodes/edges DDL with numeric weight, init command'
description: 'Define the Dolt SQL schema mirroring docs/architecture/graph-schema.md: nodes table (id, kind for question/term/belief, title, body, weight numeric, timestamps), edges table (from_id, to_id, kind constrained to begets/probes/refines/contradicts/agrees/disagrees). Add a quizdom db-init subcommand (or make target) that creates the dolt repo and applies the DDL, plus checked-in schema files. Document the schema in graph-schema.md alongside the AIDA mapping it replaces. Acceptance: db-init on a clean checkout produces a working empty Dolt db; DDL is idempotent; recursive CTE over edges works on a hand-inserted fixture.'
