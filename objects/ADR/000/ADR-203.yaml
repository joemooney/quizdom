  content: 'Measurement 2026-07-21 (main @ 3146ae3): the CLI-spawn choice holds, but spawn COUNT is the problem, not the mechanism. ''quizdom curate'' over the 75-node bank = 264 dolt spawns, 2m09s wall for 12s CPU (~0.37s startup each). STORY-244 collapses the N+1 call pattern into set-based queries; sql-server remains deferred and should only be revisited if batching leaves a latency problem.'
