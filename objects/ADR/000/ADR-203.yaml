title: Dolt access starts as dolt sql CLI spawns behind the storage trait; sql-server adoption deferred
description: 'Decision (2026-07-19): quizdom talks to Dolt by spawning dolt sql -r json per query, behind the storage trait from EPIC-202 - the same choke-point pattern used for aida spawns today, so no daemon lifecycle or port assignment is needed initially. A persistent dolt sql-server (MySQL protocol, sqlx/mysql client, port registered in ~/.ports) is the upgrade path if spawn latency becomes a problem; the swap is contained entirely inside the storage trait. References ADR-201.'
