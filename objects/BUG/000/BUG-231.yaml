  content: 'REOPENED 2026-07-19: fix in PR 87 is incomplete - acceptance ''db-migrate loads every custom edge'' is NOT met on main @ 39f2001. Real run: 75 nodes, 0 edges loaded; the (now independent) parity check correctly lists ~70 missed edges and a 71-vs-1 node lineage mismatch. Root cause of the failed repro in TASK-232: the exporter reads edges by parsing ''aida show <id>'', and aida show FLATTENS custom edge kinds to ''Related'' (verify: aida show BUG-231 renders its References relationship as ''Related''), so show-parse cannot recover begets/probes/etc and drops them. Fix as originally specified: read edges via per-node ''aida rel list <id> --type <kind>'' for the six kinds. ALSO: db-migrate exits 0 even when its parity report fails - must exit nonzero on parity failure so cutover scripts cannot silently proceed. STORY-209 remains blocked.'
