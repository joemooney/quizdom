  content: |-
    Implemented via commit 2278782 (branch bug-378):

    - TASK-372: /mode <arg> and /score demoted to mirror-only. The line is drawn by
      SURFACE — the shortcuts change the session, /settings set and the panel rows
      change the default — because the live mode is a `mode_set` event the session
      log restores on resume. FrontEnd::persist_score/persist_mode removed.
    - TASK-376: dissolved rather than annotated. set_mode_in_session returned
      Result<bool> only to feed the persist-vs-mirror branch; with no branch left it
      returns Result<()>, so there is no value for a caller to discard.
    - TASK-375: no-change guard restored inside persist(key), so a /settings set
      naming the value already in force leaves the file byte-identical.
    - TASK-373: hermeticity guard moved from compiled-out IO to the resolved PATH
      (settings::process_config_path, None under cfg(test)); load_or_seed_at/save_at
      take the path as a parameter. STORY-367's first acceptance criterion is now
      expressible: a_session_override_never_reaches_the_file round-trips a real temp
      file and asserts the bytes. A failed save is reported, not swallowed.
    - TASK-368: the staged flag only NOMINATES. Every staging write records the
      fingerprint of what it staged (DOLT_HASHOF_DB('STAGED'), appended to the same
      dolt sql call — no extra spawn) into a .quizdom-staged marker; a resume is
      claimed only when the repo still holds that content, and cannot-verify
      refuses. Fingerprinting the content survives the documented `dolt reset
      --hard` recovery, which a bare breadcrumb would not.
    - TASK-369: commit_tables no longer runs `dolt add` — writes have staged
      themselves since BUG-366, so the restage was redundant. A session write is
      back to three spawns, curate to its post-STORY-244 count; both asserted.

    Test status: 731/731 unit tests green (+7 in llm), 14/14 real_dolt acceptance
    tests green against dolt 2.2.1, clippy -D warnings clean, fmt clean.

    The real_dolt suite caught a fixture staging out of band without recording (the
    new guard working correctly against a test wearing the wrong hat), and two new
    #[ignore]d tests prove TASK-368 both ways against a live engine.

    Follow-up: TASK-379 (DOLT_HASHOF_DB version dependency + the crash window),
    TASK-380 (this reverses a stated STORY-194 decision — user-visible),
    TASK-381 (no-config-path load now returns Settings::default()).
