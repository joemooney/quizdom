title: 'Regressions from PR-109/PR-110: no-change guard lost, discarded Result, provenance hole, and an unverifiable acceptance'
description: |-
  Consolidation of the defects the reviews found in the two PRs just merged. Filed as one bug because they share a cause — both changes altered a persistence/commit seam without re-establishing its invariants.

  From STORY-367 (PR-110):
  - TASK-375: persist_score/persist_mode LOST the no-change guard, so a no-op /mode now rewrites settings.toml. A read-only command must not write.
  - TASK-376: set_mode_in_session's new Result<bool> is silently discarded at the /settings reconcile — the value that says whether the write happened is thrown away.
  - TASK-372: only a BARE /mode was demoted to mirror-only; /mode <arg> and /score still persist, so the flag-becomes-default class is only half closed.
  - TASK-373 (the one that matters most): settings save/load are cfg(test) no-ops, so NO test can prove the FILE survives a session that overrode it. STORY-367's acceptance asked exactly that and the review passed it — meaning the acceptance was unverifiable as written. Make the disk path testable (inject the path, or a test-only real-IO seam) and then actually prove it.

  From BUG-366 (PR-109):
  - TASK-368: staged-as-provenance has a hole — a user's own 'dolt add' reads as quizdom's leftovers, so the guard waves through exactly the edit it exists to catch.
  - TASK-369: every graph write now costs an extra dolt spawn for the pre-flight probe. That runs against STORY-244, which cut curate from 264 spawns to 4. Fold the probe into an existing call or make it conditional; do not silently give the batching win back.

  ## Acceptance
  - A no-op /mode and /score leave settings.toml byte-identical (test).
  - No Result from the persistence seam is discarded; a failed write surfaces.
  - /mode <arg> and /score follow the same rule as bare /mode — a flag never becomes a persisted default.
  - A test proves the FILE contents survive a session that overrode the value — cfg(test) no-ops must not make this unprovable.
  - A user's own 'dolt add' is still detected as foreign (test).
  - Per-write spawn count does not regress: assert the spawn count for a session write and for curate (curate must stay at its post-STORY-244 count).
  - cargo test green; real_dolt green; clippy clean.
