  content: |-
    Implemented on branch bug-277 (commit 3bf8e0b):

    - Defect 1: `guard_test_paths`, a `#[cfg(test)]` tripwire in db_backup.rs that
      panics unless BOTH `--path` and the backup directory sit under the system
      temp dir. A whitelist rather than a blacklist of known-real paths, so a test
      that forgets to pin cannot reach the real graph or backup by any route; it
      compiles out entirely in a real build.
    - Defect 2: the push moved out of the generic `run_dolt` into
      `push_to_backup`, which classifies the failure. An unrelated-history refusal
      now names the backup directory and the repo, explains these are two lineages
      rather than a diverged branch, states nothing reached the backup, and lists
      three non-destructive ways out (`--to` elsewhere / clone it out to inspect /
      `mv` aside under `.foreign-lineage`). Other push failures keep the plain shape.
    - Detection was reproduced against dolt 2.2.1 rather than guessed, which also
      surfaced the backspace runs dolt uses to erase its upload spinner (`\x08` is
      not whitespace, so `str::trim` left control characters mid-message);
      `clean_dolt_message` strips them across this file's dolt error surfaces.
    - Acceptance criterion 3 is `real_dolt_backup_refuses_a_foreign_lineage_backup`,
      which replays the exact BUG-277 sequence against the real engine: a throwaway
      claims the backup dir, then the genuine graph's backup is refused with the
      actionable message.

    Test status: 607 quizdom + 7 llm tests green; all 5 real_dolt acceptance tests
    pass against dolt 2.2.1; fmt clean; no new clippy warnings.
    Follow-up: TASK-278 (no --force flag; overwrite shipped as a documented mv
    recipe), TASK-279 (same control-character trail in db_init / db_migrate /
    dolt_store), TASK-280 (extend the tripwire to those modules).
