- id: 019f8867-7ef8-76b3-bace-5a9a05eaaf60
  target_id: 019f8867-7b7a-76d3-b1ae-a95eec1aebac
  author: aida
  node_id: ''
  lamport: 410
  timestamp: 2026-07-22T05:58:31.928267193Z
  kind: !Create
    title: apply_log_signals enforces the batch contract in one direction only — extra returned entries are silently dropped
    description: |
      crates/quizdom/src/signals.rs:277-281 (TASK-246, PR-91).

      take_by_id's error text states the contract as "a batch load must return one
      entry per requested id", but only the MISSING direction is enforced. After the
      walk over `applied` completes, any entries the bank/reweighter returned that
      nobody asked for are still sitting in the BTreeMap and are silently dropped
      when it goes out of scope.

      Benign in practice — a superset batch still answers every request correctly,
      and pairing is by id so an extra entry can't misattribute anything. But the
      contract as written in the error message is stricter than the check that
      backs it, so a bank that over-returns violates the stated invariant without
      anyone noticing.

      Options if this is worth closing: assert `loaded.is_empty()` after the walk
      and error naming the unrequested ids, or soften the error text to describe
      only what is actually enforced ("must return an entry for every requested
      id").

      Raised in review of PR-91: https://github.com/joemooney/quizdom/pull/91#issuecomment-5042411535
    req_type: Task
    status: Draft
    priority: Medium
- id: 019f8867-e70f-7c03-908a-9f702eb1ab2d
  target_id: 019f8867-e52a-7161-a8d3-136364a46196
  author: aida
  node_id: ''
  lamport: 411
  timestamp: 2026-07-22T05:58:58.575263088Z
  kind: !Create
    title: take_by_id's doc-comment justifies remove-over-get with a scenario the caller makes unreachable, and it is untested
    description: |
      crates/quizdom/src/signals.rs:265-267 (TASK-246, PR-91).

      The doc-comment on take_by_id reads:

          Removing rather than borrowing means a batch that returned one id twice
          can't satisfy two requests with the same entry.

      "Two requests" for the same id cannot occur. `applied` is built from the
      BTreeSet<String> at signals.rs:143-146, so the id list passed to
      load_questions is unique by construction — the walk never asks for the same
      id twice.

      The `remove` choice is still the right defensive default (it is the strictly
      safer primitive and costs nothing), so this is not a request to change the
      code. Two smaller things:

      1. The rationale describes a state the caller makes impossible, which will
         mislead the next reader into thinking duplicate requests are a live
         concern. Rewording to the invariant that actually holds — "the id list is
         unique by construction; `remove` keeps that true even if a future caller
         stops deduping" — says the same thing honestly.
      2. No test pins the duplicate-returned-entry behavior that index_by_id
         silently collapses (last wins). If the collapse is intended, a test
         naming it would make it intended-and-checked rather than incidental.

      Raised in review of PR-91: https://github.com/joemooney/quizdom/pull/91#issuecomment-5042411535
    req_type: Task
    status: Draft
    priority: Medium
