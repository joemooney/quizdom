    title: 'TASK-286''s premise was wrong: persist.rs''s two ''dead'' helpers are live'
    description: |
      TASK-286 (bundled into STORY-293) said two genuinely-dead helpers survive
      behind `#[allow(dead_code)]` in persist.rs and should be deleted. They are
      not dead:

      - `QuestionLink::rel_endpoints` (crates/quizdom/src/persist.rs) is called by
        `StoreUserAuthoredQuestionPersister::persist_user_authored_question` to wire
        the begets/probes edge.
