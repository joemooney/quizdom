- id: 019f881f-1654-71a0-819a-5fbdf1a8f91b
  target_id: 019f881f-1220-71c1-8e32-6e4ce5406640
  author: aida
  node_id: ''
  lamport: 328
  timestamp: 2026-07-22T04:39:26.548711494Z
  kind: !Create
    title: apply_log_signals pairs question to signal positionally with zip — a short load_questions misattributes silently
    description: |
      crates/quizdom/src/signals.rs:225-233 (STORY-244, PR-90).

      apply_log_signals builds its batch as:

          bank.load_questions(&ids)?.into_iter()
              .zip(applied.iter().map(|(_, signal)| *signal))

      and then zips the reweighted result against `applied` a second time to
      build the ReweightOutcome list. Both pairings are POSITIONAL, and `zip`
      truncates silently.

      If any QuestionBank impl's `load_questions` ever returns fewer than
      `ids.len()` entries — or the same count in a different order — every
      question from the drop point on is paired with the PREVIOUS question's
      signal, and the emitted ReweightOutcome reports the wrong `question_ref`
      alongside it. Curate would print, and persist, plausible-looking but
      wrong re-weights with no error.

      Not reachable today: the trait default (`store.rs`-style strict collect
      into Result) and the Dolt-backed override (`bank.rs:117-124`, strict
      `fetch_nodes` + `collect::<Result<_>>`) both return exactly one question
      per id in requested order. But `load_questions` is a DEFAULT trait method
      any bank may override, and its immediate neighbour `load_terms` is
      deliberately LENIENT (`filter_map(.ok())`) — so "strict" is a documented
      convention rather than an enforced one, sitting one method away from its
      own counterexample.

      Suggested fix: assert the invariant at the seam rather than trusting it —
      e.g. a length check returning QuizdomError before the zip, or pair by
      looking each id up in a map keyed by question id instead of by position.

      Raised in review of PR-90: https://github.com/joemooney/quizdom/pull/90#issuecomment-5041919599
    req_type: Task
    status: Draft
    priority: Medium
- id: 019f881f-4b3b-7d43-8513-4125c4075684
  target_id: 019f881f-49c3-72f1-a940-5b31aa2763e1
  author: aida
  node_id: ''
  lamport: 329
  timestamp: 2026-07-22T04:39:40.091739699Z
  kind: !Create
    title: 'load_probed_terms is now all-or-nothing: one absent probes target drops every definition for the question'
    description: |
      crates/quizdom/src/honing.rs:147-154 (STORY-244, PR-90).

      Before: `bank.probes(id).filter_map(|r| bank.load_term(&r.id).ok())` —
      a per-term `.ok()`, so a probes target that failed to load dropped only
      itself and the other definitions still reached the user.

      After: `bank.load_terms(&ids).unwrap_or_default()`. The Dolt-backed
      override (`bank.rs:127-135`) calls `fetch_nodes(&ids)?`, which is STRICT
      about a missing row — it returns Err for the whole batch. The
      `unwrap_or_default()` then swallows that into an empty Vec, so a single
      absent probes target silently drops EVERY definition for that question.

      Near-unreachable in practice, and the doc comment on `load_terms` says
      so explicitly: the schema's `fk_edges_to` foreign key (db/schema.sql:31)
      guarantees a probes target always has a `nodes` row. The conversion case
      (a node with no `definition:` line) is still handled leniently by the
      override's own `filter_map`, correctly.

      What's worth a second look is the strictness ASYMMETRY, not the current
      behaviour: the trait DEFAULT `load_terms` is lenient per-item, while the
      Dolt override is all-or-nothing. Two impls of one method with different
      blast radii on the same failure is the kind of drift the STORY-244
      default-impl design was specifically built to prevent everywhere else.
      It also degrades silently — no log line distinguishes "this question
      probes no terms" from "the batch read failed".

      Suggested fix: make the override lenient about missing rows too (fetch
      and skip absentees, mirroring the default), or have `load_probed_terms`
      log rather than `unwrap_or_default()` the error away.

      Raised in review of PR-90: https://github.com/joemooney/quizdom/pull/90#issuecomment-5041919599
    req_type: Task
    status: Draft
    priority: Medium
- id: 019f881f-852a-73b1-807b-de8f4aa861ee
  target_id: 019f881f-83ba-79e3-96f0-f3e28042cf31
  author: aida
  node_id: ''
  lamport: 330
  timestamp: 2026-07-22T04:39:54.922593669Z
  kind: !Create
    title: MAX_BATCH_IDS chunks on id count, not SQL byte length — a wide tags batch could exceed MAX_ARG_STRLEN
    description: |
      crates/quizdom/src/dolt_store.rs:24-28 and 389-415 (STORY-244, PR-90).

      `MAX_BATCH_IDS = 500` bounds how many ids ride in one `IN (...)` list or
      one batched `UPDATE`. Its doc comment says it "bounds the SQL text handed
      to a single `dolt` spawn" — but it bounds the ID COUNT, and for
      `update_weights` the dominant term is the tags payload, not the ids.

      Each CASE arm is ` WHEN '<id>' THEN '<tags>'`, and `nodes.tags` is
      VARCHAR(2048) (db/schema.sql:15). A worst-case 500-row chunk is therefore
      ~1 MB of SQL, handed to `dolt sql -q` as a SINGLE argv element. Linux caps
      one argv element at MAX_ARG_STRLEN = 32 pages = 131072 bytes — a separate,
      much lower limit than the ~2 MB total ARG_MAX. Exceeding it fails execve
      with E2BIG, which would surface as an opaque spawn error, not a SQL error.

      Measured, not hypothetical-only: on the real 61-question curate run the
      UPDATE statement is roughly 45 KB — about a third of the limit already,
      with tags averaging ~40 bytes against a 2048-byte ceiling. So the current
      bank is safe, but the headroom is ~3x on payload, not the ~8x the id
      count suggests.

      Cosmetic because reaching it needs unusually long tags. Suggested fix:
      chunk on accumulated byte length (flush the chunk when the built SQL
      passes, say, 64 KB) instead of on id count — or pipe the SQL to `dolt sql`
      on stdin rather than as an argv element, which sidesteps the limit
      entirely.

      Raised in review of PR-90: https://github.com/joemooney/quizdom/pull/90#issuecomment-5041919599
    req_type: Task
    status: Draft
    priority: Medium
