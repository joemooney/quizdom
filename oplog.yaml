    description: |
      BUG-277 added `guard_test_paths` (crates/quizdom/src/db_backup.rs), a
      `#[cfg(test)]` tripwire that panics unless db-backup / db-restore are aimed
      under the system temp directory. It closes the exact accident that caused the
      bug — a run that resolved the DEFAULT path and wrote to the user's real
      backup.

      The same accident is still reachable through the other Dolt commands, which
      have no such guard:

        - db_init.rs      (`run_db_init` resolves `resolve_dolt_path()`)
        - db_migrate.rs   (same chain, and it bulk-imports)
        - dolt_store.rs   (`domain_store_from_config` at :554)

      Today every test in those modules does pin its own temp dir, so nothing is
      broken — this is about making that structural rather than conventional. A
      db-migrate test that forgot to pin would import over the real data/dolt, which
      is a strictly worse outcome than the backup poisoning BUG-277 was filed for.

      Shape: lift `guard_test_paths` out of db_backup.rs into a shared home (it
      takes two paths and asserts both are under `std::env::temp_dir()`) and call
      it from `db_init` / `db_migrate` / the store constructor. Half an hour,
      and it retires a whole class of accident.

