  kind: !Create
    title: config_value's doc comment still claims 'matched-pair unquoting' after TASK-265
    description: |
      `crates/quizdom/src/settings.rs:492` — `config_value`'s doc comment reads:

          /// Read one key out of the flat config schema, matching [`Settings::from_toml`]
          /// exactly: case-insensitive keys, matched-pair unquoting, and LAST occurrence
          /// wins on a repeated key.

      TASK-265 (PR-99) promoted the value parse from `unquote` to `parse_value`:
      double AND single quotes come off, and an inline `# comment` ends the value.
      Matched-pair stripping is now only the DEGRADE path for input that is not
      TOML-legal (`strip_matched_double_quotes`).

      The comment is therefore stale in the one place a reader goes to learn what
      this function accepts. "case-insensitive keys" and "LAST occurrence wins" are
      both still accurate; only the unquoting clause needs rewording to point at
      [`parse_value`].

