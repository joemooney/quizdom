  lamport: 539
  timestamp: 2026-07-22T16:57:25.577750216Z
  kind: !Create
    title: DomainStore's fetch_nodes_present skip-contract is doc-enforced only — a backend that reports absence as Dolt() silently loses leniency
    description: |
      crates/quizdom/src/store.rs:183-196 (STORY-293 / TASK-256, PR-101).

      STORY-293 changed the default `fetch_nodes_present` from
      `filter_map(|id| self.fetch_node(id).ok())` to an explicit match that skips
      only `Err(QuizdomError::NotFound(_))` and propagates every other error. That
      is the right fix — it is what lets a store failure stop reading as an empty
      graph.

      But it also moves the contract a backend has to satisfy. Before, the default
      was lenient about *any* error; now leniency is conditional on the backend's
      `fetch_node` reporting "no such row" as `NotFound` specifically. A second
      `DomainStore` whose `fetch_node` reports a missing row as `Dolt(...)` (the
      variant `missing_node` itself used until this commit) or `Parse(...)` would
      have every absence propagate as a hard failure, turning the lenient read into
      the strict one — silently, with no compile error and no test failure.

      Latent today: `DoltDomainStore` is the only impl, it overrides
      `fetch_nodes_present` outright, and its `missing_node` was updated in the same
      commit. The exposure is entirely for the second backend — the same "it will
      trap the second backend" framing TASK-256 was filed under.

      What is missing is discoverability: the obligation lives only in the
      doc-comment at store.rs:183-185. Nothing mechanically forces an implementor
      to reach for `NotFound`. Options worth weighing:

      - A `#[doc]`-level contract note is what exists; consider making it a named
        invariant in docs/architecture/graph-schema.md alongside the store seam.
      - A shared constructor (`store::missing_node(id)` promoted out of dolt_store)
        so a backend gets the right variant by using the helper rather than by
        reading prose.
      - A trait-level conformance test helper any backend impl can call, pinning
        "an absent id is skipped by the lenient read and fails the strict one".

      Not a blocker for PR-101 — the change is strictly better than what it
      replaced. Filed so the obligation is not rediscovered by the backend that
      trips over it.

      Raised in review of PR-101: https://github.com/joemooney/quizdom/pull/101#issuecomment-5049025018
    req_type: Task
    status: Draft
    priority: Medium
