    title: QuizdomError::NotFound is a new public error variant; only the Dolt store emits it today
    description: |
      TASK-256's fix needed an error variant that lets a `DomainStore` default tell
      "no such row" from "the store failed". STORY-293 added
      `QuizdomError::NotFound(String)` (crates/quizdom/src/error.rs) rather than
      string-matching the `Dolt(String)` message, as the spec directed.

      Two consequences worth the advisor knowing:

      1. `QuizdomError` is a public enum, so this is an additive change to the
         crate's error surface. Its `Display` is a plain message pass-through like
         the other string variants, so nothing user-facing changed wording.
      2. Only `dolt_store::missing_node` emits it today, and it is emitted for
         NODES only. Other "not found" conditions still use `Dolt`/`Parse` with
         their existing messages — e.g. `QuestionBank`'s `missing term {id}` and
         `persist.rs`'s `no such node` mock paths. That is deliberate: STORY-293
         converted exactly what `fetch_nodes_present` needs and left the rest alone
         to stay inside "no behavior change beyond the stated contract fixes".

      If a later spec wants `NotFound` to be the project-wide convention for
      absence, that is a separate sweep with its own test-churn cost (two dolt_store
      tests already had to move from matching `Dolt` to `NotFound`).

