  lamport: 450
  timestamp: 2026-07-22T07:22:08.802313191Z
  kind: !Create
    title: db-init and db-migrate never commit — their writes sit untracked in the Dolt working set
    description: |
      `db-init` applies the schema DDL and `db-migrate` bulk-imports the graph with
      plain `dolt sql -q`, neither followed by `dolt add -A` + `dolt commit`. Only
      `DoltDomainStore` commits (dolt_store.rs:163-171). Consequence found while
      working STORY-261: the live `data/dolt` had exactly one commit ("Initialize data
      repository") and all 75 nodes / 75 edges sat untracked in the working set, so
      the first `db-backup` pushed an EMPTY history and reported success.

      STORY-261 worked around it — `db-backup` snapshots the working set before
      pushing (db_backup.rs `snapshot_working_set`) — but the root inconsistency
      remains: `dolt log` in a freshly bootstrapped+migrated repo is not the audit
      trail CLAUDE.md and dolt_store.rs describe, and any other consumer of Dolt
      history (diff between sessions, `dolt sql --branch`, a future dolt-backup mode)
      sees nothing until someone runs db-backup.

      Suggested fix: give db-init and db-migrate the same add+commit tail the store
      uses ("quizdom db-init: schema", "quizdom db-migrate: import N nodes / M
      edges"), which also makes db-migrate's idempotency visible as no-op commits.

      Raised by the implementer while working STORY-261.
      Branch: story-261  ·  Commit: 31dcff3  (PR link added on merge)
    req_type: Task
    status: Draft
    priority: Medium
- id: 019f88b4-388b-7eb0-8188-b98714315e25
  target_id: 019f88b4-365b-7e53-a546-e4be30d05981
  author: aida
  node_id: ''
  lamport: 451
  timestamp: 2026-07-22T07:22:20.171959479Z
  kind: !Create
    title: Backups are explicit (db-backup), not an automatic push after session writes
    description: |
      TASK-243 offered two shapes: "a Dolt remote with a push after session writes, or
      a scheduled dolt backup". STORY-261 shipped neither automatically — `quizdom
      db-backup` is an explicit command, documented for cron / post-session use in
      OVERVIEW.md § Durability and recovery.

      Reasoning: a push is several dolt spawns (seconds), and ADR-203 already spawns
      `dolt` per query with no daemon. Spending that on every session write would tax
      the interactive loop for a guarantee the user hasn't asked for, and a silent
      per-write push has no obvious failure surface when the backup directory is a
      removable disk that isn't mounted.

      Also chosen here, for the advisor's awareness:
      - File remote (not DoltHub, not `dolt backup`), matching TASK-243's stated
        preference for avoiding a hosted-account dependency.
      - Default backup directory `~/.local/share/quizdom/dolt-backup` (env >
        settings > default), deliberately outside the project tree.
      - `db-restore` refuses to overwrite an existing repo rather than merging.

      If unattended durability is wanted, the natural follow-up is a post-session
      hook or a systemd timer rather than an in-loop push.

      Raised by the implementer while working STORY-261.
      Branch: story-261  ·  Commit: 31dcff3  (PR link added on merge)
    req_type: Task
    status: Draft
    priority: Medium
