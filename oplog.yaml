- id: 019f8a51-1f07-77b1-a228-3789d36e99da
  target_id: 019f8a51-1cb7-7a81-b5a2-d0161a2c1d32
  author: aida
  node_id: ''
  lamport: 488
  timestamp: 2026-07-22T14:53:20.007419722Z
  kind: !Create
    title: 'settings.rs correctness: TOML-legal values, anchored relative paths, and a save that never loses keys'
    description: |-
      Bundles TASK-265, TASK-263, TASK-266, TASK-267, TASK-268, TASK-262 — all in settings.rs, file-disjoint from the other EPIC-289 batches.

      TASK-265: unquote() strips only a matched pair of DOUBLE quotes and has no notion of a trailing '# comment', though the file is .toml. So dolt_path = "/tmp/x"  # the big disk resolves to the literal string including the comment, and dolt_path = '/tmp/x' keeps its single quotes. Pre-existing mangling, but the blast radius grew: db-init will now happily CREATE a repo at that garbage path.

      TASK-263: resolve_dolt_path returns the tier's string unanchored, and callers hand it to Command::current_dir / Path::join. The compiled default data/dolt and any relative dolt_path resolve against the PROCESS cwd, while the settings file is per-user and global — so one config line selects a DIFFERENT repo from each sibling worktree. Anchor relative paths to a stable base (project root or the settings file's dir); document which.

      TASK-266: a persisted score setting is ignored on load and clobbered by the engine default on the next save.
      TASK-267: Settings::rendered_line's catch-all arm silently drops a key added to MODELLED_KEYS — a maintenance trap that loses data the moment someone extends the list.
      TASK-268: settings::save falls back to a fresh write when the existing file is unreadable, dropping exactly the foreign keys TASK-218 was fixed to preserve.
      TASK-262: dolt_path stays invisible in /settings after STORY-258 took the preserve-foreign-lines option — surface it so users can see the value that selects their graph.

      ## Acceptance
      - A TOML-legal settings file parses correctly: double-quoted, single-quoted, and values with trailing inline comments all yield the bare value (tests for each).
      - A relative dolt_path resolves to the SAME repo from two different worktrees; the anchoring rule is documented in CLAUDE.md or OVERVIEW.md.
      - A persisted score survives a load/save round trip.
      - Adding a key to MODELLED_KEYS without updating rendered_line fails a test rather than silently dropping it.
      - save on an unreadable existing file refuses or preserves, never silently drops foreign keys (test).
      - /settings shows dolt_path.
      - cargo test green; clippy clean under -D warnings.
    req_type: Story
    status: Approved
    priority: Medium
- id: 019f8a51-5e7c-7271-bf1a-3fa6a625c567
  target_id: 019f8a51-5a9d-78e1-8a45-43227b11a79a
  author: aida
  node_id: ''
  lamport: 489
  timestamp: 2026-07-22T14:53:36.252984220Z
  kind: !Create
    title: 'Dolt commit lifecycle: db-init and db-migrate must commit their own writes'
    description: |-
      Bundles TASK-272, TASK-270, TASK-271.

      TASK-272 (the substantive one): db-init applies the schema DDL and db-migrate bulk-imports the graph with plain 'dolt sql -q', neither followed by 'dolt add -A' + 'dolt commit'. Only DoltDomainStore commits. Consequence found during STORY-261: a freshly bootstrapped+migrated data/dolt had exactly ONE commit ('Initialize data repository') with all 75 nodes and 75 edges sitting untracked in the working set — so the first db-backup pushed an EMPTY history and reported success. STORY-261 papered over it by having db-backup snapshot the working set first, but the root inconsistency stands: a migrated repo should have real history, and no other command should have to compensate. Make db-init and db-migrate commit their own writes with meaningful messages; keep them idempotent and re-runnable.

      TASK-270: reachable's depth-limit error advises raising a session variable (cte_max_recursion_depth), which the per-spawn CLI model (ADR-203) makes impossible — the advice cannot be followed. Replace it with something actionable for the spawn model.

      TASK-271: the real_dolt same-second tie-break fixture is coupled to node-mint ordering, and its assert_ne guard can fire spuriously — a flaky test in the suite CI now runs for real.

      ## Acceptance
      - After db-init followed by db-migrate on a clean path, 'dolt log' shows commits covering the schema and the imported data; the working set is clean ('dolt status' reports nothing to commit).
      - db-backup on such a repo pushes real history (regression test: bootstrap, migrate, backup, clone the remote, assert node/edge counts AND more than one commit).
      - Both commands stay idempotent — a second run is a no-op and does not create empty commits.
      - The depth-limit error suggests something achievable under the per-spawn model.
      - The tie-break fixture cannot fire spuriously; it no longer depends on mint ordering.
      - cargo test green; real_dolt tests green; clippy clean.
    req_type: Story
    status: Approved
    priority: Medium
- id: 019f8a51-a12c-7240-9ff1-9f6c39a155dc
  target_id: 019f8a51-9d4f-7321-98bf-f43fab3256b7
  author: aida
  node_id: ''
  lamport: 490
  timestamp: 2026-07-22T14:53:53.324899656Z
  kind: !Create
    title: 'Backup hardening: guard the real vector, stop parsing dolt prose, and clean up the operator surface'
    description: |-
      Bundles TASK-283, TASK-280, TASK-282, TASK-284, TASK-276, TASK-278, TASK-275, TASK-279 — db_backup.rs and its tests.

      TASK-283 (the one that matters): BUG-277's fix hardened TEST paths, but the actual vector that poisoned the real backup directory was an unpinned MANUAL db-backup run. That is still unguarded. Close the real hole — e.g. refuse to push a repo whose lineage is unrelated to the remote's without an explicit opt-in, and make the default backup path harder to claim by accident.
      TASK-280: extend the real-path tripwire beyond db-backup to db-init / db-migrate / dolt_store tests, so no test can write to a resolved real location.
      TASK-282: the db-backup test tripwire silently no-ops if a tests/ directory is ever added — a guard that can quietly stop guarding.
      TASK-284: push_to_backup concatenates stderr and stdout with no separator before matching markers, so a marker can be formed across the seam.
      TASK-276: clean-tree detection matches a literal dolt message string — it breaks silently on a dolt upgrade. Detect via exit status or structured output instead.
      TASK-278: BUG-277 shipped the 'explicitly overwrite' option as a documented mv recipe rather than a real flag; add the flag so the documented escape hatch is executable.
      TASK-275: db-backup/db-restore print unquoted paths in copy-paste hints — broken for any path with a space.
      TASK-279: other dolt error surfaces still forward backspace control characters into messages (terminal corruption).

      ## Acceptance
      - A manual db-backup against a remote holding an unrelated lineage fails with the actionable error and cannot silently proceed; the documented overwrite path is a flag, not a prose recipe (test both).
      - No test in the workspace can write to a resolved real backup/dolt path; the tripwire covers db-init, db-migrate and dolt_store, and cannot no-op if a tests/ dir appears (test asserting the guard itself is live).
      - Clean-tree detection survives a changed dolt message (no literal prose match on the happy path).
      - stderr/stdout are separated before marker matching.
      - Printed paths are shell-quoted; a path containing a space round-trips through the printed command.
      - No control characters reach user-facing messages from any dolt surface.
      - cargo test green; real_dolt green; clippy clean.
    req_type: Story
    status: Approved
    priority: Medium
- id: 019f8a51-f015-7eb0-b310-efca50cf64ca
  target_id: 019f8a51-ec52-73b1-b31d-7564589d935c
  author: aida
  node_id: ''
  lamport: 491
  timestamp: 2026-07-22T14:54:13.525478578Z
  kind: !Create
    title: Trait contract follow-through and dead-code hygiene
    description: |-
      Bundles TASK-253, TASK-256, TASK-254, TASK-285, TASK-286 — store.rs, signals.rs, session.rs, persist.rs. Scheduled LAST in EPIC-289 because it touches the widest file set.

      TASK-253: apply_log_signals enforces the batch contract in ONE direction only — a missing id errors, but EXTRA returned entries are silently dropped. Complete the contract so both violations are caught.
      TASK-256: DomainStore::fetch_nodes_present's default does self.fetch_node(id).ok(), swallowing genuine store failures and absent rows alike, while the Dolt override propagates failures. This is exactly the default-vs-override asymmetry TASK-247 removed from load_terms, reintroduced one layer down. Noted as currently unavoidable because QuizdomError has no not-found variant, so missing_node and a query failure share the Dolt(String) variant — so the real fix is probably a NotFound variant that lets the default distinguish them. Latent today (one impl, and it overrides), but it will trap the second backend.
      TASK-254: take_by_id's doc-comment justifies remove-over-get with a scenario the caller makes unreachable, and it is untested — fix the rationale or make it reachable and test it.
      TASK-285: STORY-260 silenced clippy::too_many_arguments with #[allow] rather than introducing payload structs; do the refactor the lint was asking for.
      TASK-286: two genuinely-dead helpers survive behind #[allow(dead_code)] in persist.rs — delete them.

      ## Acceptance
      - An over-returning batch is an error naming the seam, symmetric with the missing-id case (test both directions).
