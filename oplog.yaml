  author: aida
  node_id: ''
  lamport: 442
  timestamp: 2026-07-22T07:03:03.778870900Z
  kind: !Create
    title: reachable's depth-limit error suggests raising a session variable, which the per-spawn model makes impossible
    description: |
      crates/quizdom/src/dolt_store.rs:411-415 (TASK-248/STORY-259, PR-94).

      The CTE depth-limit error tells the user to "raise that session variable to
      walk a deeper chain". Under ADR-203 every query is its own `dolt sql` spawn,
      so there is no persistent session for the user to raise anything in — a
      `SET SESSION cte_max_recursion_depth = N` run in a separate `dolt sql`
      invocation has no effect on quizdom's next spawn. The advice reads as
      actionable but is not.

      TASK-224's own note points at where the knob would actually have to live:
      "Could SET SESSION cte_max_recursion_depth in the query if it ever matters"
      — i.e. quizdom would have to prepend the SET to the same statement batch it
      already sends, or expose a setting that does.

      Secondary: CTE_MAX_RECURSION_DEPTH is a hardcoded 1000 (the engine default),
      but the engine's own message is appended as the trailing detail. If the
      limit is ever non-default, the output contradicts itself — "depth limit of
      1000 hops ... Engine detail: recursive query aborted after 2001 iterations".
      Either parse the number out of the engine text, or soften the wording to
      "the default limit of 1000".

      Not blocking: STORY-259's acceptance only asks that the error name the limit
      rather than leak the raw engine string, which it does. This is about the
      remediation advice being unreachable, not the error being wrong.

      Raised in review of PR-94: https://github.com/joemooney/quizdom/pull/94#issuecomment-5042890190
    req_type: Task
    status: Draft
    priority: Medium
- id: 019f88a3-23eb-74c1-af1a-a048f97d541f
  target_id: 019f88a3-21bd-7660-a897-9b8df5c8b14d
  author: aida
  node_id: ''
  lamport: 443
  timestamp: 2026-07-22T07:03:40.779130896Z
  kind: !Create
    title: real_dolt same-second tie-break fixture is coupled to node-mint ordering; its assert_ne guard can fire spuriously
    description: |
      crates/quizdom/src/dolt_store.rs, real_dolt_full_trait_surface, the TASK-221
      same-second block (~line 1385) (STORY-259, PR-94).

      The comment says "Targets are chosen to straddle the lexical/numeric split",
      but the 7 fan nodes are not chosen — they are minted sequentially by
      create_node and land at Q-5..Q-11 only because exactly 4 chain questions are
      created ahead of them. Lexical sort of Q-5..Q-11 is Q-10, Q-11, Q-5..Q-9,
      which differs from insertion order, so the fixture is meaningful today.

      The `assert_ne!(lexical, targets, "the fixture is only meaningful if lexical
      != insertion order")` guard is the right defensive move — it fails loudly
      rather than asserting something vacuous. But it is coupled to fixture
      ordering: any future edit that creates more Question nodes earlier in the
      test can push the fan into a decade-aligned run (e.g. Q-20..Q-26), where
      lexical == insertion and the guard fires a failure that looks like a
      regression in the ordering contract but is really fixture drift.

      Options: mint the fan nodes with explicitly chosen ids rather than
      sequential ones; or pick the fan count/offset so the straddle is structural;
      or reword the comment to say the guard exists precisely because the ids are
      NOT chosen, so the next reader knows what a failure there means.

      Only affects the #[ignore]d real_dolt test, so CI never sees it — the cost is
      a confusing local failure, not a broken build.

      Raised in review of PR-94: https://github.com/joemooney/quizdom/pull/94#issuecomment-5042890190
    req_type: Task
    status: Draft
    priority: Medium
