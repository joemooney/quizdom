- id: 019f888b-d9d1-7590-bc66-453602e59ac3
  target_id: 019f888b-d7fc-73d3-8cc1-f532ed753e39
  author: aida
  node_id: ''
  lamport: 428
  timestamp: 2026-07-22T06:38:14.481182886Z
  kind: !Create
    title: 'settings.toml: an inline comment or single-quoted dolt_path yields a garbage path, and db-init now creates a repo there'
    description: |
      `unquote` (crates/quizdom/src/settings.rs:578) strips only a MATCHED pair of
      double quotes and has no notion of a trailing `# comment` — both of which the
      file's own `.toml` extension implies are legal. So a valid-TOML value is
      mangled by `config_entry` (settings.rs:408):

          dolt_path = "/tmp/x/inline"  # the big disk
          -> resolves to the literal string: "/tmp/x/inline"  # the big disk
          dolt_path = '/tmp/x/single'
          -> resolves to the literal string: '/tmp/x/single'

      The value-mangling half is PRE-EXISTING — the old `dolt_store::config_value`
      used `trim_matches('"')` and was equally broken. What STORY-258 changes is the
      blast radius: before TASK-228, `db-init` ignored the settings file entirely, so
      a malformed `dolt_path` produced only a runtime "no Dolt repo at ..." read
      error. Now `db-init` acts on it and silently CREATES a repo at the garbage
      path, reporting success:

          $ quizdom db-init          # dolt_path has an inline comment
          Initialised Dolt repo at "/tmp/x/inline"  # the big disk.
          Applied domain-graph schema (nodes, edges) — DDL is idempotent.
          $ find .
          ./"
          ./"/tmp
          ./"/tmp/x/inline"  # the big disk      <- a real Dolt repo nested under cwd

      The user then has a bootstrapped-looking repo in the wrong place and an
      unhelpful path in every subsequent error message.

      Fix shape: in `config_entry`, strip an unquoted trailing `# ...` before
      unquoting, and accept `'...'` as well as `"..."` in `unquote`. Both readers go
      through `config_entry` since TASK-222, so one change covers the runtime store,
      db-init and db-migrate.

      Out of scope for STORY-258's acceptance, which asked the two readers to AGREE
      on the same input — and they now do, identically.

      Raised in review of PR-93: https://github.com/joemooney/quizdom/pull/93#issuecomment-5042707911
    req_type: Task
    status: Draft
    priority: Medium
- id: 019f888c-0710-79b2-a992-d1cd5ef54177
  target_id: 019f888c-0542-74f1-985e-871aa1846126
  author: aida
  node_id: ''
  lamport: 429
  timestamp: 2026-07-22T06:38:26.064185475Z
  kind: !Create
    title: A persisted score setting is ignored on load and clobbered by the engine default on the next save
    description: |
      `frontend.rs:305 sync_score` saves whenever the engine-owned score-gauge state
      differs from the loaded setting, but nothing feeds the LOADED setting back into
      the engine. The engine therefore starts from its own default and immediately
      persists it over whatever the file said. A read-only session is enough:

          $ printf 'score = on\ndolt_path = "..."\n' > $XDG_CONFIG_HOME/quizdom/settings.toml
          $ printf '/settings\n/quit\n' | quizdom
              Score gauge:  Off              <- the file said on
          $ cat $XDG_CONFIG_HOME/quizdom/settings.toml
          score = false                      <- silently rewritten

      PRE-EXISTING, not a regression from PR-93: `frontend.rs` and `session.rs` are
      untouched by that PR, and the pre-fix `save` rewrote all four modelled keys
      unconditionally too.

      It matters more now than it did: TASK-218 makes settings.toml safe to
      hand-edit (foreign keys survive a save), which invites users to hand-edit the
      modelled keys as well — and `score` is the one that silently does not stick.

      Worth checking whether `mode` has the same shape via `sync_mode`
      (frontend.rs:313); it is guarded by a `SessionMode::parse` so it may only
      clobber when the engine has an explicit mode to push.

      Fix shape: seed the engine's score-gauge state from `settings.score` at session
      start, so the first `sync_score` is a no-op rather than an overwrite.

      Raised in review of PR-93: https://github.com/joemooney/quizdom/pull/93#issuecomment-5042707911
    req_type: Task
    status: Draft
    priority: Medium
- id: 019f888c-301d-7c73-a5b9-2522e53d3e73
  target_id: 019f888c-2db5-75b3-97b5-6e10a399ac3a
  author: aida
  node_id: ''
  lamport: 430
  timestamp: 2026-07-22T06:38:36.573749594Z
  kind: !Create
    title: Settings::rendered_line's catch-all arm silently drops a key added to MODELLED_KEYS
    description: |
      `Settings::rendered_line` (crates/quizdom/src/settings.rs:347) matches the
      modelled keys by string and ends in:

          // Unreachable for MODELLED_KEYS; a nothing-line is the safe degrade.
          _ => String::new(),

      The comment is true today, but the invariant is unenforced. Adding a fifth
      entry to `MODELLED_KEYS` (settings.rs:158) without a matching arm compiles
      clean and silently omits that key from BOTH `to_toml` and `to_toml_merged` —
      so the setting never persists and there is no warning.

      `save_preserves_keys_the_settings_surface_does_not_model` (settings.rs:687)
      would only catch it for a key whose test value differs from its default; a new
      key added with a default-valued assertion slips through.

      Fix shape: either a `#[test]` asserting `to_toml` contains every entry of
      `MODELLED_KEYS`, or key the render off the `SettingKey` enum so the match is
      exhaustive and the compiler enforces it.

      Raised in review of PR-93: https://github.com/joemooney/quizdom/pull/93#issuecomment-5042707911
    req_type: Task
    status: Draft
    priority: Medium
- id: 019f888c-6641-7772-ab2d-2c5d36763356
  target_id: 019f888c-6404-7453-8027-1ccca616cec0
  author: aida
  node_id: ''
  lamport: 431
  timestamp: 2026-07-22T06:38:50.433959150Z
  kind: !Create
    title: settings::save falls back to a fresh write when the existing file is unreadable, dropping the foreign keys TASK-218 preserves
    description: |
      `settings::save` (crates/quizdom/src/settings.rs:528) reads the existing file
      with:

          let existing = std::fs::read_to_string(&path).unwrap_or_default();
          std::fs::write(path, settings.to_toml_merged(&existing))

      `unwrap_or_default()` collapses "file absent" (correct: fall through to a fresh
      write) with "file present but unreadable". In the second case
      `to_toml_merged("")` takes its empty-input branch and re-emits ONLY the four
      modelled keys — which is exactly the TASK-218 failure mode the merge path was
      written to eliminate, just behind a narrower door.

      Two ways in: mode bits that permit write but not read, and non-UTF8 content
      (`read_to_string` fails on invalid UTF-8 even when the file is readable).

      Both are unlikely for a file the app itself writes, hence cosmetic — but the
      degrade is silent and destroys `dolt_path`, so it is cheap insurance to
      distinguish the cases:

          let existing = match std::fs::read_to_string(&path) {
              Ok(text) => text,
              Err(e) if e.kind() == std::io::ErrorKind::NotFound => String::new(),
              Err(e) => return Err(e),   // refuse to overwrite what we could not read
          };

      Raised in review of PR-93: https://github.com/joemooney/quizdom/pull/93#issuecomment-5042707911
    req_type: Task
    status: Draft
    priority: Medium
